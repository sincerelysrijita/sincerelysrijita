    <style>

        .poetry-page {
            max-width: 850px;
            margin: 0 auto;
            padding: 80px 25px 100px;
        }

        .poem-list {
            margin-top: 55px;
        }

        .poem-item {
            display: grid;
            grid-template-columns: 45px 1fr auto;
            align-items: center;
            gap: 20px;
            padding: 25px 5px;
            border-bottom: 1px solid #ded5c9;
        }

        .poem-number {
            font-family: 'Playfair Display', serif;
            color: #a3978d;
            font-size: 1rem;
        }

        .poem-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.3rem;
            font-weight: 400;
        }

        .poem-title a {
            color: #292523;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .poem-title a:hover {
            color: #913f42;
        }

        .poem-date {
            font-family: 'DM Sans', sans-serif;
            font-size: 0.75rem;
            color: #81766e;
            white-space: nowrap;
            letter-spacing: 0.5px;
        }

        @media (max-width: 600px) {

            .poetry-page {
                padding-top: 50px;
            }

            .poem-item {
                grid-template-columns: 30px 1fr;
                gap: 12px;
                padding: 22px 0;
            }

            .poem-date {
                grid-column: 2;
                margin-top: -5px;
            }

            .poem-title {
                font-size: 1.1rem;
            }

        }

    </style>
</head>
